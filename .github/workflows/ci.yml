# Integración continua: en cada push o pull request a main se prueban el backend y el servicio de IA.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (FastAPI + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Pruebas de integración
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/salonflow_test
        run: pytest -v

  ia:
    name: Servicio de IA (TensorFlow + FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ia/requirements.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Pruebas del servicio (usa el modelo versionado modelo_riesgo.keras)
        env:
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: pytest -v

  base-de-datos:
    name: Script de Supabase actualizado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerar y comparar
        run: |
          bash BaseDeDatos/supabase/generar.sh
          git diff --ignore-cr-at-eol --exit-code BaseDeDatos/supabase/salonflow_supabase.sql \
            || { echo "::error::salonflow_supabase.sql no corresponde a 01_esquema.sql + 02_datos_prueba.sql. Ejecuta: bash BaseDeDatos/supabase/generar.sh"; exit 1; }
